server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/Moviez_Database
    username: postgres
    password: secret
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          show_sql: true
  config:
    import: optional:file:.env[.properties]
  application:
    name: Moviez
  payu:
    api:
      payu-order: "https://secure.snd.payu.com/api/v2_1/orders"
      payu-token: "https://secure.snd.payu.com/pl/standard/user/oauth/authorize"
    shop:
      client-id: 516019
      client-secret: ${CLIENT_PAYU_SECRET}
  kafka:
    bootstrap-servers: localhost:9092

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/myrealm

